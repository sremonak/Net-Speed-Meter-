name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug & release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Use private signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          STORE_TYPE: ${{ secrets.SIGNING_STORE_TYPE }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.keystore"
              echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD"
              echo "SIGNING_KEY_ALIAS=$KEY_ALIAS"
              echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD"
              echo "SIGNING_STORE_TYPE=${STORE_TYPE:-jks}"
            } >> "$GITHUB_ENV"
            echo "Signing with private key from repository secrets"
          else
            echo "Signing with bundled keystore/netspeed-dev.p12"
          fi

      - name: Build APKs
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace assembleDebug assembleRelease

      - name: Collect APKs
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/NetSpeedMeter-v${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/NetSpeedMeter-v${VERSION}-debug.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: NetSpeedMeter-apk
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
